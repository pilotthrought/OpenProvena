# OpenProvena Nginx - HTTP Only
events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    error_log     /var/log/nginx/error.log warn;
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml text/javascript;

    # Variables pour la résolution DNS dynamique
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 80;
        server_name _;

        set $frontend_host "frontend:3000";
        set $backend_host "backend:8000";

        # Static files from Next.js
        location /_next/static/ {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Static assets
        location /icons/ {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /images/ {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        location /favicon.ico {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # API routes
        location /api/ {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Health check
        location /health {
            proxy_pass http://$backend_host;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            access_log off;
        }

        # Frontend (catch all)
        location / {
            proxy_pass http://$frontend_host;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
